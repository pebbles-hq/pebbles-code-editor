[package]
name = "demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# Same rev as the library's `pebbles` dep — otherwise cargo builds two copies of the
# framework and the demo's `IntoWidget`/`Widget` bounds don't match the lib's editor type.
pebbles = { git = "https://github.com/pebbles-hq/pebbles", rev = "6b263d4dc0462c65a8df58d7268a2ed44c6be638" }
pebbles-code-editor = { path = "../..", version = "0.1.0" }

