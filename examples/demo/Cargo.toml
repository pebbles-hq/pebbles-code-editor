[package]
name = "demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# Same rev as the library's `pebbles` dep — otherwise cargo builds two copies of the
# framework and the demo's `IntoWidget`/`Widget` bounds don't match the lib's editor type.
pebbles = { git = "https://github.com/pebbles-hq/pebbles", rev = "56ec7b068a627c216a6d654b9e53e0ed64fb201c", default-features = false }
pebbles-code-editor = { path = "../..", version = "0.1.0", default-features = false }

[features]
default = ["vello-hybrid"]
vello-hybrid = ["pebbles/vello-hybrid", "pebbles-code-editor/vello-hybrid"]
wgpu = ["pebbles/wgpu", "pebbles-code-editor/wgpu"]
