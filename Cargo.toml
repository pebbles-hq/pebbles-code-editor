# pebbles-code-editor — a reusable, embeddable code editor widget for the Pebbles GUI
# framework. Syntax highlighting (pluggable languages), a line-number gutter, current-
# line highlight, selection + caret, and swappable themes. Built to be the foundation
# an IDE can grow on. Depends on the `pebbles` framework by git.
[workspace]
members = [".", "examples/demo"]

[package]
name = "pebbles-code-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Embeddable, syntax-highlighting code editor widget for the Pebbles GUI framework — a custom editing engine with pluggable languages, multi-cursor, folding, soft wrap, IntelliSense provider hooks, an extension API, and full theming. The foundation to build an IDE on. Part of the Pebbles ecosystem."
authors = ["Reyco Seguma"]
license = "Apache-2.0"
repository = "https://github.com/pebbles-hq/pebbles-code-editor"
readme = "README.md"
keywords = ["editor", "code-editor", "syntax", "gui", "pebbles"]
categories = ["gui", "text-editors"]


[dependencies]
# Pinned to a reviewed framework commit — `cargo update` won't silently ingest an
# unreviewed `main` HEAD. Bump the rev deliberately when adopting framework changes.
pebbles = { git = "https://github.com/pebbles-hq/pebbles", rev = "2a3a995419bcb221dfec8ceec8fe3c513b1bf867" }
# The document store: a rope for O(log n) splice + line indexing on large files.
ropey = "1"
# Regex search mode (find/replace). Plain + whole-word search need no engine.
regex = "1"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Lints for the editor crate. An editor slices and indexes text constantly, so these are
# WARN, not DENY: they flag every raw `&str` slice / unchecked index / unguarded arithmetic
# as a spot to double-check a panic can't reach it (the memory-safety class this crate cares
# about), without blocking the build on the existing call sites. `all` runs at a lower
# priority so the specific lints below can override it. Clippy in CI is warn-only for the
# same reason; ratchet to deny once the backlog is burned down.
[lints.clippy]
all = { level = "warn", priority = -1 }
string_slice = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
