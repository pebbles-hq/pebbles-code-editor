# pebbles-code-editor — a reusable, embeddable code editor widget for the Pebbles GUI
# framework. Syntax highlighting (pluggable languages), a line-number gutter, current-
# line highlight, selection + caret, and swappable themes. Built to be the foundation
# an IDE can grow on. Depends on the `pebbles` framework by git.
[workspace]
members = [".", "examples/demo"]

[package]
name = "pebbles-code-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Embeddable, syntax-highlighting code editor widget for the Pebbles GUI framework — a custom editing engine with pluggable languages, multi-cursor, folding, soft wrap, IntelliSense provider hooks, an extension API, and full theming. The foundation to build an IDE on. Part of the Pebbles ecosystem."
authors = ["Reyco Seguma"]
license = "Apache-2.0"
repository = "https://github.com/pebbles-hq/pebbles-code-editor"
readme = "README.md"
keywords = ["editor", "code-editor", "syntax", "gui", "pebbles"]
categories = ["gui", "text-editors"]


[dependencies]
# Pinned to a reviewed framework commit — `cargo update` won't silently ingest an
# unreviewed `main` HEAD. Bump the rev deliberately when adopting framework changes.
pebbles = { git = "https://github.com/pebbles-hq/pebbles", rev = "a05fda78bf007a1f736a297caee7f9c24d50ecb8" }
# The document store: a rope for O(log n) splice + line indexing on large files.
ropey = "1"
# Regex search mode (find/replace). Plain + whole-word search need no engine.
regex = "1"
# Incremental parser-based highlighting (feature `tree-sitter`, on by default). Each grammar
# crate compiles its generated C parser; without the feature the hand-written scanners in
# `lang/` are used.
tree-sitter = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }

[dev-dependencies]
# Headless harness (semantics queries, chord presses through the shell's key routing).
pebbles-testing = { git = "https://github.com/pebbles-hq/pebbles", rev = "a05fda78bf007a1f736a297caee7f9c24d50ecb8" }

[features]
default = ["tree-sitter"]
tree-sitter = [
    "dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-toml-ng", "dep:tree-sitter-json",
    "dep:tree-sitter-md", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript",
    "dep:tree-sitter-python", "dep:tree-sitter-go", "dep:tree-sitter-c", "dep:tree-sitter-cpp",
    "dep:tree-sitter-html", "dep:tree-sitter-css", "dep:tree-sitter-yaml", "dep:tree-sitter-bash",
    "dep:tree-sitter-sequel",
]

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Lints for the editor crate. An editor slices and indexes text constantly, so these are
# WARN, not DENY: they flag every raw `&str` slice / unchecked index / unguarded arithmetic
# as a spot to double-check a panic can't reach it (the memory-safety class this crate cares
# about), without blocking the build on the existing call sites. `all` runs at a lower
# priority so the specific lints below can override it. Clippy in CI is warn-only for the
# same reason; ratchet to deny once the backlog is burned down.
[lints.clippy]
all = { level = "warn", priority = -1 }
string_slice = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
